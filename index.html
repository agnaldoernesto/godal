<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godal — Buscador Inteligente</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-glow"></div>
  
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <span>Godal Engine</span>
      </div>
      <span class="status-badge">
        <span class="pulse-dot"></span> v3.6 Active
      </span>
    </header>

    <main class="search-card">
      <div class="card-header">
        <h2>O que você deseja pesquisar hoje?</h2>
        <p>Consulte especificações de dispositivos ou dados públicos de perfis.</p>
      </div>

      <!-- Segmented Control / Tabs -->
      <div class="segmented-control">
        <button id="btn-device" class="tab-btn active" onclick="selectType('device')">
          📱 Dispositivo
        </button>
        <button id="btn-person" class="tab-btn" onclick="selectType('person')">
          👤 Pessoa
        </button>
      </div>

      <!-- Input Group -->
      <div class="input-wrapper">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Ex: Nokia 3310..." 
          onkeydown="handleKeyPress(event)"
        />
        <button id="search-btn" onclick="executeSearch()">
          <span id="btn-label">Pesquisar</span>
          <div id="btn-spinner" class="spinner hidden"></div>
        </button>
      </div>

      <!-- Container de Resultado -->
      <div id="result-container" class="result-box hidden"></div>
    </main>
  </div>

  <script src="script/app.js"></script>
</body>
</html>

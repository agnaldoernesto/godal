<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godal Search Engine - Secure Beta</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="container">
        <h1>Buscador Integrado (Devices & People)</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('devices')">Buscar Dispositivo</button>
            <button class="tab-btn" onclick="switchTab('people')">Buscar Pessoa</button>
        </div>

        <div id="devices-section" class="search-section active">
            <input type="text" id="device-query" placeholder="Ex: iPhone 13 Pro Max ou ThinkPad T14">
            <button onclick="searchData('device')">Pesquisar Dispositivo</button>
        </div>

        <div id="people-section" class="search-section">
            <input type="text" id="people-query" placeholder="Ex: Nome e Sobrenome">
            <button onclick="searchData('person')">Pesquisar Pessoa</button>
        </div>

        <div id="loader" class="hidden">Buscando e processando dados...</div>
        <div id="result-container" class="hidden"></div>
    </div>

    <script src="script/app.js"></script>
</body>
</html>
